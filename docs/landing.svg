ont-size="12" font-weight="700" fill="#f2f2f5">$42.8k</text><rect x="458" y="184" width="56" height="42" rx="6" fill="#101014" stroke="#222229"/><text x="465" y="196" font-family="Arial" font-size="5" fill="#74747d">OPEN ITEMS</text><text x="465" y="214" font-family="Arial" font-size="12" font-weight="700" fill="#f2f2f5">04</text><rect x="520" y="184" width="61" height="42" rx="6" fill="#101014" stroke="#222229"/><text x="527" y="196" font-family="Arial" font-size="5" fill="#74747d">ON TRACK</text><text x="527" y="214" font-family="Arial" font-size="12" font-weight="700" fill="#f2f2f5">87%</text><rect x="396" y="234" width="118" height="74" rx="6" fill="#101014" stroke="#222229"/><text x="404" y="247" font-family="Arial" font-size="6" font-weight="700" fill="#d9d9df">Launch flow</text><rect x="404" y="258" width="92" height="4" rx="2" fill="#24242c"/><rect x="404" y="258" width="78" height="4" rx="2" fill="#b299ff"/><rect x="404" y="269" width="92" height="4" rx="2" fill="#24242c"/><rect x="404" y="269" width="55" height="4" rx="2" fill="#8a71f5"/><rect x="520" y="234" width="61" height="74" rx="6" fill="#101014" stroke="#222229"/><text x="528" y="247" font-family="Arial" font-size="6" fill="#787882">CLIENT SENTIMENT</text><text x="550" y="278" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#f4f4f6">8.7</text><circle cx="560" cy="104" r="2" fill="#b299ff" filter="url(#glow)"/></svg>